name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e
            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH || '/var/www/look-like' }}"
            cd "$PROJECT_PATH"
            if [ ! -f .env ]; then
              echo "❌ Файл .env отсутствует! Создайте его на сервере (DATABASE_URL, NEXTAUTH_URL, NEXTAUTH_SECRET) и повторите деплой."
              exit 1
            fi
            echo "📦 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main
            git clean -fd -e .env -e .env.local -e .env.production
            echo "📥 Installing dependencies..."
            npm ci --production=false
            echo "🔧 Generating Prisma client..."
            npx prisma generate
            echo "🗄️ Running database migrations..."
            npx prisma migrate deploy || npx prisma db push || true
            echo "🏗️ Building application..."
            npm run build
            echo "🔄 Restarting application..."
            pm2 restart look-like || pm2 start npm --name "look-like" -- start
            sleep 5
            if curl -sf -o /dev/null --connect-timeout 10 http://127.0.0.1:3000/admin; then
              echo "✅ Deployment completed successfully! App responds on :3000"
            else
              echo "⚠️ App may not be ready. Check: pm2 logs look-like"
            fi
