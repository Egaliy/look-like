# Like That — доступ по IP 130.49.149.162 (приложение слушает порт 3002)
# Скопировать в /etc/nginx/sites-available/like-that
# и включить: ln -sf /etc/nginx/sites-available/like-that /etc/nginx/sites-enabled/0-like-that
# Имя 0-like-that нужно, чтобы этот сайт обрабатывал IP первым (до configurator).
# Без nginx можно открывать напрямую: http://130.49.149.162:3002

server {
    listen 80;
    server_name 130.49.149.162;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
